name: ManyFEWS
channels:
  # See the note in manyFEWS.base.yml: 'defaults' must not be added here.
  - conda-forge
dependencies:
  # dev dependencies
  # Keep this version in sync with .pre-commit-config.yaml and
  # .github/workflows/black.yml, or CI lint and local pre-commit will disagree.
  - black=24.10.0
  - pre-commit
  - pytest
  - selenium==4.4.0
  - coverage>=6.5.0
  - webdrivermanager
prefix: /usr/local/Caskroom/miniconda/base/envs/ManyFEWS
