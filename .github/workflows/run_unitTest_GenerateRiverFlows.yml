name: Unit Tests
on: push

jobs:

  test:
    name: Set up and test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    services:
      postgres:
        image: postgis/postgis:14-3.2
        env:
          # must specify password for PG Docker container image, see: https://registry.hub.docker.com/_/postgres?tab=description&page=1&name=10
          POSTGRES_USER: manyfews
          POSTGRES_PASSWORD: manyfews
          POSTGRES_DB: manyfews
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7

      -
        name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin

      -
        name: Cache Miniconda environment
        uses: actions/cache@v6
        with:
          # Cache the downloaded conda packages rather than the environment
          # directory itself: setup-miniconda installs Miniforge into
          # ~/miniconda3 and builds the env there, so pre-seeding the env dir
          # fights with the installer. ~/conda_pkgs_dir is setup-miniconda's
          # default package directory.
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}--${{ runner.arch }}--${{ hashFiles('config/manyFEWS.base.yml', 'config/manyFEWS.devel.yml') }}-${{ env.CACHE_NUMBER }}
        env:
          # Increase this to manually invalidate the cache
          CACHE_NUMBER: 0
        id: cache

      -
        name: Install chromedriver
        uses: nanasess/setup-chromedriver@v3

      -
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: anaconda-client-env
          environment-file: config/manyFEWS.base.yml
          python-version: 3.9
          auto-activate-base: false

      # https://github.com/conda-incubator/setup-miniconda/issues/105#issuecomment-730243912
      -
        name: Install dev dependencies and list packages
        shell: bash -l {0}
        run: |
          conda env update -n anaconda-client-env -f config/manyFEWS.devel.yml
          conda info
          conda list

      -
        name: Install npm
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: manyfews/package-lock.json

      -
        name: Run Django migrations
        run: |
          cp ./manyfews/.env.CI ./manyfews/.env
          python manage.py migrate
        working-directory: manyfews

      -
        name: Start XVFB
        run: |
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 & # optional

      -
        name: Collect static files
        # STORAGES["staticfiles"] is ManifestStaticFilesStorage (settings.py), so
        # {% static %} tags resolve hashed filenames from a manifest that only
        # collectstatic generates. Without this step every page using base.html
        # raises "Missing staticfiles manifest entry" and the Selenium tests below
        # fail before they can find any element.
        run: python manage.py collectstatic --noinput
        working-directory: manyfews

      -
        name: Run Django tests
        env:
          MAP_URL: ${{ secrets.MAP_URL }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DISPLAY: :99
          # StaticLiveServerTestCase serves static files by their literal
          # source filename via the staticfiles finders - it has no idea
          # about the ManifestStaticFilesStorage hash manifest used above, so
          # {% static %} tags would resolve to hashed URLs that 404 here.
          STATICFILES_STORAGE_BACKEND: django.contrib.staticfiles.storage.StaticFilesStorage
        run: coverage run --source='.' manage.py test
        working-directory: manyfews

      -
        name: Check npm and webpack
        # 'npm ci' (not 'npm install') so the build is reproducible from the
        # lockfile - otherwise the bundle can differ from the committed one and
        # the 'built assets are up-to-date' check below fails spuriously.
        run: |
          npm ci
          npm run build
        working-directory: manyfews

      -
        name: Check built assets are up-to-date
        # Pathspecs are relative to the working directory, so this must be
        # 'webapp/static', not 'manyfews/webapp/static' - the latter resolved to
        # manyfews/manyfews/webapp/static, matched nothing, and made this check
        # silently pass no matter what the build produced.
        run: |
          if [[ `git status --porcelain webapp/static` ]]; then
            echo "Static files are not up to date:"
            git status --porcelain webapp/static
            echo "Run 'npm ci && npm run build' from the 'manyfews' directory and commit the changes."
            exit 1
          fi
        working-directory: manyfews

      -
        name: Create coverage.py XML report
        run: |
          coverage xml
        working-directory: manyfews

      -
        name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
